---
deployment:
  tasks:
    # active theme is the parent "kingster", so templates deploy there
    - export STAGING=/home/pf5q6fgg782b/public_html/ureka-staging.myffuae.com/wp-content/themes/kingster
    - /bin/cp -f wp-content/themes/kingster-child/page-als.php $STAGING/page-als.php
    - /bin/cp -f wp-content/themes/kingster-child/als-app.html $STAGING/als-app.html
    - /bin/cp -f wp-content/themes/kingster-child/als-hero.mp4 $STAGING/als-hero.mp4
    - /bin/cp -f wp-content/themes/kingster-child/als-hero-poster.jpg $STAGING/als-hero-poster.jpg
    - /bin/cp -f wp-content/themes/kingster-child/ipp-hero-poster.jpg $STAGING/ipp-hero-poster.jpg
    - /bin/cp -f wp-content/themes/kingster-child/page-ipp.php $STAGING/page-ipp.php
    - /bin/cp -f wp-content/themes/kingster-child/ipp-app.html $STAGING/ipp-app.html
    - /bin/cp -f wp-content/themes/kingster-child/ipp-hero.mp4 $STAGING/ipp-hero.mp4
    - /bin/mkdir -p $STAGING/speakers
    - /bin/cp -f wp-content/themes/kingster-child/speakers/*.jpg wp-content/themes/kingster-child/speakers/*.webp $STAGING/speakers/
    # staging runs without page cache; SpeedyCache drop-in serves stale files even when the plugin is off
    - export STWC=/home/pf5q6fgg782b/public_html/ureka-staging.myffuae.com/wp-content
    - /bin/rm -f $STWC/advanced-cache.php
    - /bin/rm -rf $STWC/cache/speedycache
    # LIVE ureka.co.uk (additive: new template files only, nothing overwritten)
    - export LIVE=/home/pf5q6fgg782b/public_html/ureka.co.uk/wp-content/themes/kingster
    - /bin/cp -f wp-content/themes/kingster-child/page-als.php $LIVE/page-als.php
    - /bin/cp -f wp-content/themes/kingster-child/als-app.html $LIVE/als-app.html
    - /bin/cp -f wp-content/themes/kingster-child/als-hero.mp4 $LIVE/als-hero.mp4
    - /bin/cp -f wp-content/themes/kingster-child/als-hero-poster.jpg $LIVE/als-hero-poster.jpg
    - /bin/cp -f wp-content/themes/kingster-child/ipp-hero-poster.jpg $LIVE/ipp-hero-poster.jpg
    - /bin/cp -f wp-content/themes/kingster-child/page-ipp.php $LIVE/page-ipp.php
    - /bin/cp -f wp-content/themes/kingster-child/ipp-app.html $LIVE/ipp-app.html
    - /bin/cp -f wp-content/themes/kingster-child/ipp-hero.mp4 $LIVE/ipp-hero.mp4
    - /bin/mkdir -p $LIVE/speakers
    - /bin/cp -f wp-content/themes/kingster-child/speakers/*.jpg wp-content/themes/kingster-child/speakers/*.webp $LIVE/speakers/
    # live: SpeedyCache purge is unreliable — clear only our two pages' cache each deploy
    - /bin/rm -rf /home/pf5q6fgg782b/public_html/ureka.co.uk/wp-content/cache/speedycache/*/*/als
    - /bin/rm -rf /home/pf5q6fgg782b/public_html/ureka.co.uk/wp-content/cache/speedycache/*/*/ipp
    # staging: force https (audit fix #3) — prepend once, marker-guarded
    - export SDOC=/home/pf5q6fgg782b/public_html/ureka-staging.myffuae.com
    - /bin/grep -q UREKA-HTTPS-REDIRECT $SDOC/.htaccess || /bin/cat htaccess-https.snippet $SDOC/.htaccess > $SDOC/.htaccess.new
    - /bin/grep -q UREKA-HTTPS-REDIRECT $SDOC/.htaccess || /bin/mv -f $SDOC/.htaccess.new $SDOC/.htaccess
    # staging: install Rank Math plugin files (one-shot; activation done in wp-admin)
    - export SPLUG=/home/pf5q6fgg782b/public_html/ureka-staging.myffuae.com/wp-content/plugins
    - /bin/sh -c 'test -d $SPLUG/seo-by-rank-math || (cd /tmp && curl -sL -o rankmath.zip https://downloads.wordpress.org/plugin/seo-by-rank-math.latest-stable.zip && unzip -oq rankmath.zip -d $SPLUG && rm -f rankmath.zip)'
    # staging: mu-plugin with RM caps fix, alt fallback, header hardening
    - /bin/cp -f wp-content/mu-plugins/ureka-seo-tweaks.php /home/pf5q6fgg782b/public_html/ureka-staging.myffuae.com/wp-content/mu-plugins/ureka-seo-tweaks.php
    # ---- LIVE SEO rollout (mirrors staging; all idempotent) ----
    - export LDOC=/home/pf5q6fgg782b/public_html/ureka.co.uk
    # live: force https 301 (audit fix #3), marker-guarded so it runs once
    - /bin/grep -q UREKA-HTTPS-REDIRECT $LDOC/.htaccess || /bin/cp -f $LDOC/.htaccess $LDOC/.htaccess.bak-preseo
    - /bin/grep -q UREKA-HTTPS-REDIRECT $LDOC/.htaccess || /bin/cat htaccess-https.snippet $LDOC/.htaccess > $LDOC/.htaccess.new
    - /bin/grep -q UREKA-HTTPS-REDIRECT $LDOC/.htaccess || /bin/mv -f $LDOC/.htaccess.new $LDOC/.htaccess
    # live: Rank Math plugin files (activation happens in wp-admin)
    - /bin/mkdir -p $LDOC/wp-content/mu-plugins
    - /bin/sh -c 'test -d $LDOC/wp-content/plugins/seo-by-rank-math || (cd /tmp && curl -sL -o rm-live.zip https://downloads.wordpress.org/plugin/seo-by-rank-math.latest-stable.zip && unzip -oq rm-live.zip -d $LDOC/wp-content/plugins && rm -f rm-live.zip)'
    # live: mu-plugin (RM caps fix, image alt fallback, HSTS + no PHP version header)
    - /bin/cp -f wp-content/mu-plugins/ureka-seo-tweaks.php $LDOC/wp-content/mu-plugins/ureka-seo-tweaks.php
